<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-page title, description, canonical, social tags and JSON-LD.
         Filled from seo/pages.ts by seo/plugin.ts. -->
    <!--seo:head-->

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Ashish Kumar Mishra" />
    <meta name="google-site-verification" content="1UpHMajCLJISBerWywJuL9Qa6Lux3RHXe3k6IBrmVNY" />
    <meta name="application-name" content="Markdown2PDF" />
    <meta name="apple-mobile-web-app-title" content="Markdown2PDF" />
    <meta name="theme-color" content="#2563eb" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts load without blocking the first paint; system fonts show until then. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
  </head>
  <body>
    <!-- The editor app. React owns everything inside #root. -->
    <div id="root">
      <noscript>
        <p style="max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif;">
          Markdown2PDF needs JavaScript to run the editor. The guide below explains what it does.
        </p>
      </noscript>
    </div>

    <!-- Crawlable guide, below the editor. Outside #root so React never removes it. -->
    <!--seo:body-->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
